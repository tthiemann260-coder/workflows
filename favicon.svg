<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="50" fill="url(#grad1)"/>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Candlestick Chart Icon -->
  <!-- Green Candle 1 -->
  <rect x="15" y="45" width="8" height="20" fill="#4ade80" rx="1"/>
  <line x1="19" y1="35" x2="19" y2="45" stroke="#4ade80" stroke-width="2"/>
  <line x1="19" y1="65" x2="19" y2="70" stroke="#4ade80" stroke-width="2"/>

  <!-- Red Candle 2 -->
  <rect x="32" y="30" width="8" height="25" fill="#ef4444" rx="1"/>
  <line x1="36" y1="25" x2="36" y2="30" stroke="#ef4444" stroke-width="2"/>
  <line x1="36" y1="55" x2="36" y2="65" stroke="#ef4444" stroke-width="2"/>

  <!-- Green Candle 3 -->
  <rect x="49" y="35" width="8" height="30" fill="#4ade80" rx="1"/>
  <line x1="53" y1="25" x2="53" y2="35" stroke="#4ade80" stroke-width="2"/>
  <line x1="53" y1="65" x2="53" y2="72" stroke="#4ade80" stroke-width="2"/>

  <!-- Green Candle 4 -->
  <rect x="66" y="25" width="8" height="35" fill="#4ade80" rx="1"/>
  <line x1="70" y1="20" x2="70" y2="25" stroke="#4ade80" stroke-width="2"/>
  <line x1="70" y1="60" x2="70" y2="68" stroke="#4ade80" stroke-width="2"/>

  <!-- Trend Line -->
  <path d="M 15 65 L 35 50 L 50 45 L 75 25" stroke="white" stroke-width="2.5" fill="none" opacity="0.8" stroke-linecap="round"/>

  <!-- Chart Point Circles -->
  <circle cx="15" cy="65" r="3" fill="white" opacity="0.9"/>
  <circle cx="35" cy="50" r="3" fill="white" opacity="0.9"/>
  <circle cx="50" cy="45" r="3" fill="white" opacity="0.9"/>
  <circle cx="75" cy="25" r="3" fill="white" opacity="0.9"/>
</svg>
